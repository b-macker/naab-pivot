name: Nightly Benchmarks

on:
  schedule:
    - cron: '0 2 * * *'  # Run at 2 AM UTC daily
  workflow_dispatch:     # Allow manual triggers

jobs:
  run-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 libcurl4-openssl-dev libssl-dev

      - name: Build NAAb
        run: bash build.sh

      - name: Run Full Benchmark Suite
        run: bash scripts/benchmark-all.sh

      - name: Check for Performance Regressions
        run: ./naab/build/naab-lang tests/performance/regression-suite.naab
        continue-on-error: true

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.run_number }}
          path: benchmark-history/*.json
