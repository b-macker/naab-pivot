name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 nodejs libcurl4-openssl-dev libssl-dev

      - name: Build NAAb
        run: bash build.sh

      - name: Run Unit Tests
        run: |
          cd tests
          bash run-all-tests.sh unit

      - name: Run Integration Tests
        run: |
          cd tests
          bash run-all-tests.sh integration

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests/results/

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: error

      - name: Check File Permissions
        run: |
          test -x build.sh || exit 1
          test -x install.sh || exit 1
